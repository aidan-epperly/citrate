name: tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LUAU_VERSION: "0.743"

    steps:
      - uses: actions/checkout@v4

      - name: Install Luau
        run: |
          curl -sSL -o luau.zip "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          mkdir -p "$HOME/luau" && unzip -q luau.zip -d "$HOME/luau"
          echo "$HOME/luau" >> "$GITHUB_PATH"

      - name: Generated modules are up to date
        run: python3 tools/generate.py --check

      - name: Type check
        run: luau-analyze src/*.luau tests/*.luau bench/*.luau

      - name: Tests
        run: luau tests/run.luau
